[package]
name = "anpdf"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
description = "Local agent-native PDF toolkit"
rust-version = "1.100"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.42", default-features = false }
flate2 = { version = "1", default-features = false }
pdfium-render = { version = "=0.9.5", optional = true, default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
pdf_oxide = { version = "=0.3.78", optional = true, features = ["rendering"] }

[features]
default = ["pdfium"]
pdfium = ["dep:pdfium-render"]
pdfoxide = ["dep:pdf_oxide"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
