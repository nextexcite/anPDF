name: Rust and contract qualification
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ANPDF_QPDF_EXACT: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            experimental: false
            cargo_args: ''
          - runner: macos-26
            experimental: true
            cargo_args: ''
          - runner: ubuntu-26.04
            experimental: false
            cargo_args: --no-default-features
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Qualify Rust code and checked-in generation
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets ${{ matrix.cargo_args }} -- -D warnings
          cargo test --locked ${{ matrix.cargo_args }}
          cargo build --locked ${{ matrix.cargo_args }}
      - name: Install independent PDF test tooling
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils
          else
            brew install poppler
          fi
          mkdir -p build/work
          python3 build/get-qpdf.py build/work/qpdf > build/work/qpdf-path
      - name: Cross-surface corpus
        shell: bash
        run: |
          python3 -m venv build/work/test-venv
          build/work/test-venv/bin/python -m pip install -r build/test-requirements.txt
          ANPDF_QPDF="$(cat build/work/qpdf-path)" build/work/test-venv/bin/python tests/integration.py
      - name: Synthetic backend comparison
        if: runner.os == 'Linux' && matrix.cargo_args == ''
        shell: bash
        run: |
          python3 -m venv build/work/bench-venv
          . build/work/bench-venv/bin/activate
          python3 -m pip install -r build/test-requirements.txt
          python3 build/get-test-font.py build/work/font
          python3 -m unittest bench/test_bench.py -v
          python3 bench/corpus.py build/work/bench-corpus
          ANPDF_QPDF="$(cat build/work/qpdf-path)" python3 bench/harness.py --corpus build/work/bench-corpus --provider 'qpdf=python3 bench/providers/qpdf.py' --provider 'poppler=python3 bench/providers/poppler.py' --out build/work/bench-results
      - name: Upload backend comparison report
        if: runner.os == 'Linux' && matrix.cargo_args == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-comparison
          path: build/work/bench-results/report.md
  pdfium:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and PDF test tooling
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils python3-venv
          else
            brew install poppler
          fi
          python3 -m venv build/work/venv
          build/work/venv/bin/pip install -r build/test-requirements.txt
          python3 build/get-qpdf.py build/work/qpdf > build/work/qpdf-path
          python3 build/get-pdfium.py build/work/pdfium > build/work/pdfium-path
          python3 build/get-test-font.py build/work/font
      - name: Qualify default bundled PDFium provider
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          cp "$(cat build/work/pdfium-path)" target/debug/
          unset ANPDF_PDFIUM_LIB
          ANPDF_QPDF="$(cat build/work/qpdf-path)" ANPDF_TEST_FONT="$PWD/build/work/font/NotoSansSC.ttf" build/work/venv/bin/python tests/integration.py
  oci-smoke:
    runs-on: ubuntu-26.04
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local amd64 image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anpdf:ci
          provenance: false
          sbom: false
      - name: Restricted structural and PDFium smoke tests
        run: sh containers/smoke.sh anpdf:ci
  forge-output:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Verify pinned Forge regeneration and probe fidelity
        run: |
          mkdir -p build/work
          python3 build/get-forge.py build/work/forge.tgz
          python3 build/generate.py --archive build/work/forge.tgz --out build/work/regen
          diff -ruN generated build/work/regen
          npm ci --ignore-scripts --prefix build/qualification
          mkdir -p build/qualification/work
          cp -R generated/ts generated/mcp generated/capnweb build/qualification/work/
          build/qualification/node_modules/.bin/tsc -p build/qualification/tsconfig.json
          node --import ./build/qualification/register-hooks.mjs build/qualification/probe.mjs
  privacy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan complete independent history
        run: |
          python3 build/get-tool.py gitleaks build/work/gitleaks
          build/work/gitleaks/gitleaks git --redact --no-banner --log-opts=--all
          python3 build/privacy.py --ci
