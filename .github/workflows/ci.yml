name: Rust and contract qualification
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ANPDF_QPDF_EXACT: '1'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            experimental: false
            cargo_args: ''
          - runner: macos-26
            experimental: true
            cargo_args: ''
          - runner: ubuntu-26.04
            experimental: false
            cargo_args: --no-default-features
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache native Rust build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: ci-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cargo_args || 'default' }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'src/**', 'contracts/**', 'generated/**') }}
          restore-keys: ci-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cargo_args || 'default' }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Qualify Rust code and checked-in generation
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets ${{ matrix.cargo_args }} -- -D warnings
          cargo test --locked ${{ matrix.cargo_args }}
          cargo build --locked ${{ matrix.cargo_args }}
      - name: Cache pinned qpdf
        id: qpdf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/qpdf
          key: qpdf-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-qpdf.py') }}
      - name: Install independent PDF test tooling
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils
          else
            brew install poppler
          fi
          mkdir -p build/work
          if [ '${{ steps.qpdf-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-qpdf.py build/work/qpdf > build/work/qpdf-path
          else
            python3 build/get-qpdf.py build/work/qpdf --path-only > build/work/qpdf-path
          fi
      - name: Cross-surface corpus
        shell: bash
        run: |
          python3 -m venv build/work/test-venv
          build/work/test-venv/bin/python -m pip install -r build/test-requirements.txt
          ANPDF_QPDF="$(cat build/work/qpdf-path)" build/work/test-venv/bin/python tests/integration.py
      - name: Cache pinned test font
        if: runner.os == 'Linux' && matrix.cargo_args == ''
        id: font-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/font
          key: test-font-v1-${{ hashFiles('build/get-test-font.py') }}
      - name: Synthetic backend comparison
        if: runner.os == 'Linux' && matrix.cargo_args == ''
        shell: bash
        run: |
          python3 -m venv build/work/bench-venv
          . build/work/bench-venv/bin/activate
          python3 -m pip install -r build/test-requirements.txt
          if [ '${{ steps.font-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-test-font.py build/work/font
          fi
          python3 -m unittest bench/test_bench.py -v
          python3 bench/corpus.py build/work/bench-corpus
          ANPDF_QPDF="$(cat build/work/qpdf-path)" python3 bench/harness.py --corpus build/work/bench-corpus --provider 'qpdf=python3 bench/providers/qpdf.py' --provider 'poppler=python3 bench/providers/poppler.py' --out build/work/bench-results
      - name: Upload backend comparison report
        if: runner.os == 'Linux' && matrix.cargo_args == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-comparison
          path: build/work/bench-results/report.md
  pdfium:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache PDFium Rust build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: ci-pdfium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'src/**', 'contracts/**', 'generated/**', 'build/get-pdfium.py') }}
          restore-keys: ci-pdfium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Cache pinned qpdf
        id: qpdf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/qpdf
          key: qpdf-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-qpdf.py') }}
      - name: Cache pinned PDFium
        id: pdfium-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/pdfium
          key: pdfium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-pdfium.py') }}
      - name: Cache pinned test font
        id: font-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/font
          key: test-font-v1-${{ hashFiles('build/get-test-font.py') }}
      - name: Install pinned Rust and PDF test tooling
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils python3-venv
          else
            brew install poppler
          fi
          python3 -m venv build/work/venv
          build/work/venv/bin/pip install -r build/test-requirements.txt
          if [ '${{ steps.qpdf-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-qpdf.py build/work/qpdf > build/work/qpdf-path
          else
            python3 build/get-qpdf.py build/work/qpdf --path-only > build/work/qpdf-path
          fi
          if [ '${{ steps.pdfium-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-pdfium.py build/work/pdfium > build/work/pdfium-path
          else
            python3 build/get-pdfium.py build/work/pdfium --path-only > build/work/pdfium-path
          fi
          if [ '${{ steps.font-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-test-font.py build/work/font
          fi
      - name: Qualify default bundled PDFium provider
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          cp "$(cat build/work/pdfium-path)" target/debug/
          python3 -c 'import json,os,pathlib,stat; q=pathlib.Path(pathlib.Path("build/work/qpdf-path").read_text().strip()); p=pathlib.Path(pathlib.Path("build/work/pdfium-path").read_text().strip()); b=pathlib.Path("target/debug")/p.name; assert q.is_file() and os.access(q,os.X_OK) and p.read_bytes()==b.read_bytes(); print(json.dumps({"qpdf":str(q.resolve()),"qpdfMode":oct(stat.S_IMODE(q.stat().st_mode)),"pdfium":str(p.resolve()),"bundledPdfium":str(b.resolve())}))'
          python3 -m unittest discover -s build -p test_downloaders.py -v
          unset ANPDF_PDFIUM_LIB
          ANPDF_QPDF="$(cat build/work/qpdf-path)" ANPDF_TEST_FONT="$PWD/build/work/font/NotoSansSC.ttf" build/work/venv/bin/python tests/integration.py
  oci-smoke:
    runs-on: ubuntu-26.04
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local amd64 image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anpdf:ci
          cache-from: type=gha,scope=oci-amd64
          cache-to: type=gha,scope=oci-amd64,mode=max,ignore-error=true
          provenance: false
          sbom: false
      - name: Restricted structural and PDFium smoke tests
        run: sh containers/smoke.sh anpdf:ci
  forge-output:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: build/qualification/package-lock.json
      - name: Cache pinned Forge archive
        id: forge-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/forge.tgz
          key: forge-v1-${{ hashFiles('build/forge-pin.json', 'build/get-forge.py') }}
      - name: Verify pinned Forge regeneration and probe fidelity
        run: |
          mkdir -p build/work
          if [ '${{ steps.forge-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-forge.py build/work/forge.tgz
          fi
          python3 build/generate.py --archive build/work/forge.tgz --out build/work/regen
          diff -ruN generated build/work/regen
          npm ci --ignore-scripts --prefix build/qualification
          mkdir -p build/qualification/work
          cp -R generated/ts generated/mcp generated/capnweb build/qualification/work/
          build/qualification/node_modules/.bin/tsc -p build/qualification/tsconfig.json
          node --import ./build/qualification/register-hooks.mjs build/qualification/probe.mjs
  privacy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned Gitleaks
        id: gitleaks-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/gitleaks
          key: gitleaks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-tool.py') }}
      - name: Scan complete independent history
        run: |
          if [ '${{ steps.gitleaks-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-tool.py gitleaks build/work/gitleaks
          fi
          build/work/gitleaks/gitleaks git --redact --no-banner --log-opts=--all
          python3 build/privacy.py --ci
