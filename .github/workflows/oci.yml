name: Release OCI and native artifacts
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "!v*-pdfoxide-preview.*"
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref_type != 'tag' || !contains(github.ref_name, '-pdfoxide-preview.')
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and validate release version
        id: meta
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"
  image:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # Build-record bundles are not release artifacts; never upload them.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve GHCR image name
        id: meta
        run: |
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          printf 'image=ghcr.io/%s/anpdf\n' "$owner" >> "$GITHUB_OUTPUT"
      - name: Build local ${{ matrix.platform }} image for restricted execution
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          load: true
          push: false
          tags: anpdf:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=oci-${{ matrix.arch }}
          cache-to: type=gha,scope=oci-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: false
          sbom: false
      - name: Non-root, read-only, network-none smoke test
        run: sh containers/smoke.sh anpdf:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}-${{ github.sha }}
      - name: Prepare export directory
        run: mkdir -p build/artifacts
      - name: Export OCI archive for SBOM and vulnerability scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}-${{ github.sha }}
          outputs: type=oci,dest=build/artifacts/anpdf.oci.tar
          cache-from: type=gha,scope=oci-${{ matrix.arch }}
          provenance: mode=min
          sbom: false
      - name: Cache pinned SBOM and vulnerability tools
        id: scan-tools-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build/work/syft
            build/work/grype
          key: scan-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-tool.py') }}
      - name: Scan OCI SBOM, licenses, and vulnerabilities before push
        run: |
          if [ '${{ steps.scan-tools-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-tool.py syft build/work/syft
            python3 build/get-tool.py grype build/work/grype
          fi
          build/work/syft/syft scan oci-archive:build/artifacts/anpdf.oci.tar -o "spdx-json=build/artifacts/anpdf-linux-${{ matrix.arch }}.spdx.json"
          build/work/grype/grype oci-archive:build/artifacts/anpdf.oci.tar -o json > "build/artifacts/anpdf-linux-${{ matrix.arch }}.grype.json"
          python3 build/oci-audit.py \
            --sbom "build/artifacts/anpdf-linux-${{ matrix.arch }}.spdx.json" \
            --grype "build/artifacts/anpdf-linux-${{ matrix.arch }}.grype.json" \
            --out "build/artifacts/oci-audit-report-linux-${{ matrix.arch }}.json"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.platform }} OCI image by digest to GHCR
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,"name=${{ steps.meta.outputs.image }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=oci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          sbom: false
      - name: Pull published digest and repeat the restricted smoke test
        run: |
          ref='${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}'
          docker pull --platform ${{ matrix.platform }} "$ref"
          sh containers/smoke.sh "$ref"
      - name: Record digest and checksums
        run: |
          arch="${{ matrix.arch }}"
          printf '%s@%s\n' '${{ steps.meta.outputs.image }}' '${{ steps.push.outputs.digest }}' > "build/artifacts/oci-digest-linux-${arch}.txt"
          (cd build/artifacts && sha256sum \
            "anpdf-linux-${arch}.spdx.json" \
            "anpdf-linux-${arch}.grype.json" \
            "oci-audit-report-linux-${arch}.json" \
            "oci-digest-linux-${arch}.txt" > "SHA256SUMS-oci-linux-${arch}.txt")
      - name: Upload OCI SBOM, scan, and digest artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-linux-${{ matrix.arch }}
          path: |
            build/artifacts/anpdf-linux-${{ matrix.arch }}.spdx.json
            build/artifacts/anpdf-linux-${{ matrix.arch }}.grype.json
            build/artifacts/oci-audit-report-linux-${{ matrix.arch }}.json
            build/artifacts/oci-digest-linux-${{ matrix.arch }}.txt
            build/artifacts/SHA256SUMS-oci-linux-${{ matrix.arch }}.txt
  image-index:
    needs: [prepare, image]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-linux-amd64
          path: build/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-linux-arm64
          path: build/artifacts
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve GHCR image name and publish multi-arch index
        id: meta
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/anpdf"
          amd64_ref=$(cat build/artifacts/oci-digest-linux-amd64.txt)
          arm64_ref=$(cat build/artifacts/oci-digest-linux-arm64.txt)
          docker buildx imagetools create \
            -t "${image}:${VERSION}-${GITHUB_SHA}" \
            -t "${image}:${VERSION}" \
            -t "${image}:latest" \
            "$amd64_ref" \
            "$arm64_ref"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Inspect and verify published multi-arch OCI index
        id: index
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest=$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" | sha256sum | awk '{print "sha256:" $1}')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          docker pull "${IMAGE}@${digest}"
          sh containers/smoke.sh "${IMAGE}@${digest}"
          {
            printf 'index=%s@%s\n' "$IMAGE" "$digest"
            printf 'linux/amd64=%s\n' "$(cat build/artifacts/oci-digest-linux-amd64.txt)"
            printf 'linux/arm64=%s\n' "$(cat build/artifacts/oci-digest-linux-arm64.txt)"
          } > build/artifacts/oci-digest.txt
          (cd build/artifacts && sha256sum oci-digest.txt > SHA256SUMS-oci-index.txt)
      - name: Upload OCI index digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-index
          path: |
            build/artifacts/oci-digest.txt
            build/artifacts/SHA256SUMS-oci-index.txt
  macos-arm64:
    needs: prepare
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache native release Rust build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: release-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'src/**', 'contracts/**', 'generated/**') }}
          restore-keys: release-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Cache pinned cargo-auditable
        id: auditable-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-auditable
          key: cargo-auditable-v1-${{ runner.os }}-${{ runner.arch }}-0.7.7-${{ hashFiles('rust-toolchain.toml') }}
      - name: Cache pinned qpdf
        id: qpdf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/qpdf
          key: qpdf-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-qpdf.py') }}
      - name: Cache pinned PDFium
        id: pdfium-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/work/pdfium
          key: pdfium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/get-pdfium.py') }}
      - name: Install pinned Rust toolchain and cargo-auditable
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if [ '${{ steps.auditable-cache.outputs.cache-hit }}' != true ]; then
            cargo install cargo-auditable --version 0.7.7 --locked
          fi
      - name: Build release macOS arm64 binary
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=${{ runner.temp }}=/tmp
        run: |
          if [ '${{ steps.pdfium-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-pdfium.py build/work/pdfium
          fi
          cargo auditable build --release --locked
      - name: Smoke test release binary with pinned qpdf
        run: |
          mkdir -p build/work
          if [ '${{ steps.qpdf-cache.outputs.cache-hit }}' != true ]; then
            python3 build/get-qpdf.py build/work/qpdf
          fi
          printf '%s\n' "$PWD/build/work/qpdf/bin/qpdf" > build/work/qpdf-path
          python3 fixtures/generate.py build/work/fixtures
          ANPDF_QPDF="$(cat build/work/qpdf-path)" ./target/release/anpdf --version
          for shell in bash zsh fish; do ./target/release/anpdf completions "$shell" >/dev/null; done
          ANPDF_QPDF="$(cat build/work/qpdf-path)" ./target/release/anpdf operations | python3 -c 'import json,sys; v=json.load(sys.stdin); assert len(v["operations"])>=6'
          ANPDF_QPDF="$(cat build/work/qpdf-path)" ./target/release/anpdf merge --root build/work/fixtures --request-json '{"inputs":[{"path":"three.pdf"},{"path":"one.pdf"}],"output":{"path":"merged.pdf"}}' | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["result"]["pageCount"]==4'
          ANPDF_QPDF="$(cat build/work/qpdf-path)" ./target/release/anpdf compress --root build/work/fixtures --request-json '{"input":{"path":"three.pdf"},"output":{"path":"compressed.pdf"}}' | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["result"]["pageCount"]==3 and v["result"]["savedBytes"]>0'
      - name: Package macOS arm64 tarball and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          stage="build/artifacts/anpdf-${VERSION}-macos-arm64"
          mkdir -p "$stage"
          cp target/release/anpdf LICENSE NOTICE license-manifest.json README.md "$stage/"
          cp build/work/pdfium/lib/libpdfium.dylib "$stage/"
          mkdir -p "$stage/PDFIUM_LICENSES"
          cp build/work/pdfium/LICENSE "$stage/PDFIUM_LICENSES/"
          cp -R build/work/pdfium/licenses "$stage/PDFIUM_LICENSES/"
          cp -R THIRD_PARTY_LICENSES "$stage/"
          ANPDF_QPDF="$(cat build/work/qpdf-path)" python3 build/smoke-content.py "$stage/anpdf" build/work/fixtures
          tar -C build/artifacts -czf "build/artifacts/anpdf-${VERSION}-macos-arm64.tar.gz" "anpdf-${VERSION}-macos-arm64"
          (cd build/artifacts && shasum -a 256 "anpdf-${VERSION}-macos-arm64.tar.gz" > SHA256SUMS-macos-arm64.txt)
      - name: Upload macOS arm64 release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: |
            build/artifacts/anpdf-${{ needs.prepare.outputs.version }}-macos-arm64.tar.gz
            build/artifacts/SHA256SUMS-macos-arm64.txt
  release:
    needs: [prepare, image-index, macos-arm64]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish development release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE: ${{ needs.image-index.outputs.image }}
          DIGEST: ${{ needs.image-index.outputs.digest }}
        run: |
          notes=$(printf 'Development `%s` build from `%s` (not production-qualified).\n\n- **OCI (`linux/amd64`, `linux/arm64`):** `%s@%s`\n  - Tags: `%s-%s`, `%s`, `latest`\n- **Native (`macos/arm64`):** `anpdf-%s-macos-arm64.tar.gz` (requires qpdf 12.4.2 on PATH or `ANPDF_QPDF`)\n- **Text/render engine:** bundled PDFium (qpdf remains the structural engine).\n- **Verification evidence:** per-arch Syft SPDX SBOMs, Grype vulnerability reports, and license/crate audits (`oci-audit-report-linux-{amd64,arm64}.json`)\n' \
            "$VERSION" "${GITHUB_SHA}" "$IMAGE" "$DIGEST" "$VERSION" "${GITHUB_SHA}" "$VERSION" "$VERSION")
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --notes "$notes" --prerelease
            gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber release-assets/*
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "anPDF ${TAG}" --notes "$notes" --prerelease release-assets/*
          fi
