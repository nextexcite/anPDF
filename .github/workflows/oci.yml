name: Preliminary OCI build (no publish)
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build local image for restricted execution
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          load: true
          push: false
          tags: anpdf:0.1.0-alpha.1-${{ github.sha }}
          provenance: false
          sbom: false
      - name: Non-root, read-only, network-none smoke test
        run: sh containers/smoke.sh anpdf:0.1.0-alpha.1-${{ github.sha }}
      - name: Prepare export directory
        run: mkdir -p build/artifacts
      - name: Export OCI and minimal provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          push: false
          tags: anpdf:0.1.0-alpha.1-${{ github.sha }}
          outputs: type=oci,dest=build/artifacts/anpdf.oci.tar
          provenance: mode=min
          sbom: false
      - name: Generate actual image SBOM and checksums
        run: |
          python3 build/get-tool.py syft build/work/syft
          build/work/syft/syft scan oci-archive:build/artifacts/anpdf.oci.tar -o spdx-json=build/artifacts/anpdf.spdx.json
          sha256sum build/artifacts/anpdf.oci.tar build/artifacts/anpdf.spdx.json > build/artifacts/SHA256SUMS
      # Artifact upload intentionally waits for the separate publication/privacy gate.
